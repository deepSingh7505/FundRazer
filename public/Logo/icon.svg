  <path d="M340 288 Q320 248 340 215 Q360 182 340 150" fill="none" stroke="#b89060" stroke-width="3.5" stroke-linecap="round" opacity="0.5" style="fill:none;stroke:rgb(184, 144, 96);color:rgb(255, 255, 255);stroke-width:3.5px;stroke-linecap:round;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <path d="M378 295 Q395 258 378 228 Q361 198 378 168" fill="none" stroke="#c8a87a" stroke-width="3.5" stroke-linecap="round" opacity="0.55" style="fill:none;stroke:rgb(200, 168, 122);color:rgb(255, 255, 255);stroke-width:3.5px;stroke-linecap:round;stroke-linejoin:miter;opacity:0.55;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

