<svg width="100%" viewBox="0 0 690 710" role="img" xmlns="http://www.w3.org/2000/svg" style="">
  <title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A steaming cup of Indian chai</title>
  <desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Illustrated cup of masala chai with steam rising, on a saucer, warm amber and brown tones</desc>

  <defs>
    <linearGradient id="tableGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8a87a"/>
      <stop offset="100%" stop-color="#a07850"/>
    </linearGradient>
    <linearGradient id="saucerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8d5b0"/>
      <stop offset="100%" stop-color="#c8a87a"/>
    </linearGradient>
    <linearGradient id="cupBodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5e8d0"/>
      <stop offset="100%" stop-color="#dfc49a"/>
    </linearGradient>
    <linearGradient id="chaiLiquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c27a2e"/>
      <stop offset="100%" stop-color="#8b4e18"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf6ec"/>
      <stop offset="100%" stop-color="#f5e8d0"/>
    </linearGradient>
    <clipPath id="cupClip">
      <path d="M230 310 Q228 490 240 510 Q280 540 340 540 Q400 540 440 510 Q452 490 450 310 Z"/>
    </clipPath>
  </defs>

  <!-- Background warm surface -->
  <rect x="0" y="0" width="680" height="700" fill="url(#bgGrad)" style="stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Table surface -->
  <ellipse cx="340" cy="590" rx="280" ry="40" fill="url(#tableGrad)" style="stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <rect x="60" y="590" width="560" height="110" fill="#a07850" style="fill:rgb(160, 120, 80);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Table edge highlight -->
