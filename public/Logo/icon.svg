  <path d="M362 290 Q377 258 362 228" fill="none" stroke="#e8d0a0" stroke-width="1.5" stroke-linecap="round" opacity="0.4" style="fill:none;stroke:rgb(232, 208, 160);color:rgb(255, 255, 255);stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:miter;opacity:0.4;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

