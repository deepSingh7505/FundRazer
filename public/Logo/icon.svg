    <line x1="0" y1="-10" x2="0" y2="10" stroke="#f5dfa0" stroke-width="1.2" style="fill:rgb(0, 0, 0);stroke:rgb(245, 223, 160);color:rgb(255, 255, 255);stroke-width:1.2px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#f5dfa0" stroke-width="1.2" style="fill:rgb(0, 0, 0);stroke:rgb(245, 223, 160);color:rgb(255, 255, 255);stroke-width:1.2px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <line x1="-7" y1="-7" x2="7" y2="7" stroke="#f5dfa0" stroke-width="1.2" style="fill:rgb(0, 0, 0);stroke:rgb(245, 223, 160);color:rgb(255, 255, 255);stroke-width:1.2px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
