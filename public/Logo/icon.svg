  <rect x="382" y="554" width="76" height="3" rx="2" fill="#a05520" opacity="0.5" transform="rotate(-12, 420, 556)" style="fill:rgb(160, 85, 32);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

