  <!-- Saucer -->
  <ellipse cx="340" cy="565" rx="155" ry="28" fill="url(#saucerGrad)" stroke="#b89060" stroke-width="1.5" style="stroke:rgb(184, 144, 96);color:rgb(255, 255, 255);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <ellipse cx="340" cy="562" rx="125" ry="18" fill="none" stroke="#c8a87a" stroke-width="1" style="fill:none;stroke:rgb(200, 168, 122);color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

